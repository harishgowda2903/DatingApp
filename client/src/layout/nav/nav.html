<header class="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-primary to-black">
    <div class="flex align-middle items-center px-10 mx-auto gap-6">
        <a class="max-h-16 text-white border-r-white border-r-2 pr-6">
            Dating App
        </a>
        <nav class="flex gap-3 my-2 uppercase text-lg text-white">
            <a>Matches</a>
            <a>List</a>
            <a>Messages</a>
        </nav>
        <div class="flex align-middle ml-auto gap-3">

            @if (accountService.currentUser(); as user) {
                <div class="dropdown dropdown-end">
                    <div tabindex="0" role="button" class="btn m-1"
                    class="flex items-center text-white text-xl gap-3 cursor-pointer">
                        <img src="/user.png" alt="user avatar" class="w-8 h-8 rounded-full" />
                        <span>{{ user.displayName }}</span>
                    </div>
                    <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
                        <li><a>Edit Profile</a></li>
                        <li><a (click)="logout()">Logout</a></li>
                    </ul>
                </div>
            }
            @else {
                <form #loginForm="ngForm" class="flex item-center gap-3">
                    <input type="text" name="email" [(ngModel)]="creds.email" placeholder="Email"
                        class="input input-bordered w-full max-w-xs" />
                    <input type="password" name="password" [(ngModel)]="creds.password" placeholder="Password"
                        class="input input-bordered w-full max-w-xs" />
                    <button class="btn btn-primary" (click)="login()">Sign In</button>
                </form>
            }

        </div>
    </div>
</header>
