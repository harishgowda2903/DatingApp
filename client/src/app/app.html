<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10 shadow-xl">
    <h1 class="text-2xl font-bold text-red-500 fon">{{ title() }}</h1>
    <ul class="list">
        @for (member of members(); track member.id) {
            <li class="list-item item-center">
                <img src="/user.png" alt="user avatar" class="w-12 h-12 rounded-full mr-4" />
                <div>
                    {{member.displayName}}
                </div>
                
            </li>
        }
    </ul>
</div>





<button class="btn btn-primary">Button</button>
